<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Войдов</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020813;         /* Глубокий темно-синий фон */
            --card: #0a1428;       /* Цвет карточки (чуть светлее) */
            --accent: #2563eb;     /* Основной синий акцент */
            --accent-hover: #1d4ed8; /* Акцент при наведении */
            --text: #e2e8f0;       /* Светло-серый текст */
            --text-muted: #64748b; /* Приглушенный текст */
            --border: #1e293b;     /* Границы */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #0a1a3a 0%, var(--bg) 70%);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: rgba(10, 20, 40, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(37, 99, 235, 0.1);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        h1 {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: 2px;
            color: #fff;
            text-shadow: 0 0 10px rgba(37, 99, 235, 0.5); /* Легкое свечение текста */
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 40px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        /* Кнопка Telegram - яркий синий */
        .btn-tg {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .btn-tg:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.5);
        }

        /* Кнопка GitHub - темная с синей рамкой */
        .btn-git {
            background: transparent;
            color: var(--text);
            border-color: var(--border);
        }

        .btn-git:hover {
            background: rgba(37, 99, 235, 0.1);
            border-color: var(--accent);
            color: #fff;
        }

        /* Кнопка Почты - приглушенная */
        .btn-mail {
            background: transparent;
            color: var(--text-muted);
            border-color: var(--border);
        }

        .btn-mail:hover {
            background: rgba(37, 99, 235, 0.1);
            color: var(--text);
            border-color: var(--text-muted);
        }

        .footer {
            margin-top: 40px;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Войдов</h1>
        <div class="subtitle">@voidov_mobile</div>

        <div class="links">
            <a href="https://t.me/voidov_mobile" target="_blank" class="btn btn-tg">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
                Telegram
            </a>
            <a href="https://github.com/lawasdqe-afk" target="_blank" class="btn btn-git">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
                GitHub
            </a>
            <a href="mailto:lawasdqe@gmail.com" class="btn btn-mail">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                Почта
            </a>
        </div>

        <div class="footer">
            &copy; 2026
        </div>
    </div>

</body>
</html>
